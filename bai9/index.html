<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS2</title>
  </head>
  <body>
    <div>Nhập điểm A: <input type="number" id="diemA" /></div>
    <div>Nhập điểm B: <input type="number" id="diemB" /></div>
    <div>Nhập điểm C: <input type="number" id="diemC" /></div>
    <button onclick="hienThiDiem()">Tính điểm</button>
    <p id="ketqua"></p>
    <div>Tuổi: <input type="number" id="namSinh" /></div>
    <button onclick="hienThiTuoi()">Tính Tuổi</button>
    <p id="ketquaTuoi"></p>
    <script>
      function tinhDiemChu() {
        var A = parseFloat(document.getElementById("diemA").value);
        var B = parseFloat(document.getElementById("diemB").value);
        var C = parseFloat(document.getElementById("diemC").value);
        var diem = A * 0.6 + B * 0.3 + C * 0.1;
        if (diem >= 8.5) {
          return "A";
        } else if (diem >= 7) {
          return "B";
        } else if (diem >= 5.5) {
          return "C";
        } else if (diem >= 4) {
          return "D";
        } else if (diem >= 0 && diem < 4) {
          return "F";
        } else {
          return "Điểm không hợp lệ";
        }
      }
      function hienThiDiem() {
        document.getElementById("ketqua").innerHTML =
          "Điểm chữ: " + tinhDiemChu();

        //innerHTML: thuộc tính của đối tượng document, dùng để thay đổi nội dung của thẻ HTML
      }
      function tinhTuoi() {
        var namSinh = parseInt(document.getElementById("namSinh").value);
        var namHienTai = new Date().getFullYear();
        return namHienTai - namSinh;
      }
      function hienThiTuoi() {
        document.getElementById("ketquaTuoi").innerHTML =
          "Tuổi của bạn là: " + tinhTuoi();
      }
