<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 10-JS</title>
    <style>
      img {
        width: 20%;
      }
      .khung {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="khung">
      <h1 class="cheDo">Chế độ sáng</h1>
      <img class="anh" src="../anh/bai9 -javascript/mattroi.png" />
      <div class="chuc-nang">
        <button onclick="doiCheDo()">Đổi chế độ</button>
      </div>
    </div>
    <script>
      //cheDo boolean: true là chế độ sáng, false là chế độ tối
      //để ở ngoài function vì khi cho vào trong thì sẽ mặc định là true, khi click vào thì nó sẽ đổi sang false nhưng khi click lần nữa thì nó lại là true
      var cheDo = true;
      function doiCheDo() {
        if (cheDo == true) {
          document.getElementsByTagName("body")[0].style =
            "background-color: black";
          document.getElementsByClassName("cheDo")[0].style = "color: white";
          document.getElementsByClassName("cheDo")[0].innerHTML = "Chế độ tối";
          document.getElementsByClassName("anh")[0].src =
            "../anh/bai9 -javascript/mattrang.png";
          cheDo = false;
        } else {
          document.getElementsByTagName("body")[0].style =
            "background-color: white";
          document.getElementsByClassName("cheDo")[0].style = "color: black";
          document.getElementsByClassName("cheDo")[0].innerHTML = "Chế độ sáng";
          document.getElementsByClassName("anh")[0].src =
            "../anh/bai9 -javascript/mattroi.png";
          cheDo = true;
        }
      }
    </script>
  </body>
</html>
