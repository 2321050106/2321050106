<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <style>
      h2 {
        color: orange; /* color dùng để quy định màu chữ */
      }
      #h2 {
        color: red;
      }
      .h2 {
        background-color: yellow;
      }
    </style>

    <title>Bài 5</title>
  </head>
  <body>
    <!-- I.cách viết style -->
    <!-- kiểu 1 viết style trong thẻ -->
    <h1 style="color: blue">HUMG</h1>
    <!-- kiểu 2 viết style trong thẻ head -->
    <h2>Trường đại học Mỏ địa chất</h2>
    <!-- kiểu 3 viết style trong file css riêng -->
    <h3>Khoa CNTT</h3>
    <!-- II.selector -->
    <!-- Cách 1 dùng tên thẻ -->

    <!-- Cách 2 dùng dùng id có dấu # đằng trước -->
    <h2 id="h2" class="h2">HUMG</h2>
    <!-- Cách 3 dùng class có dấu . đằng trước -->
    <h3 class="tieude">Lớp phát triển ứng dụng web</h3>
  </body>
</html>
