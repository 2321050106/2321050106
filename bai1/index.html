<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bai 1 html</title>
  </head>
  <body>
    Môn phát triển ứng dụng web + btl
    <!-- Đây là chú thích
    cách 1 ctrl + k + c 
    cách 2 ctrl + / -->
    <p>Thẻ p là thẻ phân đoạn</p>

    <!-- Thẻ ha là thẻ định dạng đề mục -->
    <h1>Thẻ h1 là thẻ tiêu đề lớn</h1>
    <h2>Thẻ h2 là thẻ tiêu đề nhỏ hơn</h2>
    <h3>Thẻ h3 là thẻ tiêu đề nhỏ hơn nữa</h3>

    <!-- Thẻ br là thẻ xuống dòng -->
    <p>
      Môn web <br />
      Nhóm 03
    </p>

    <!-- Thẻ div và span là thẻ phân vùng  -->
    <div>Đây là thẻ div</div>
    <span>Đây là thẻ span</span>
    <!-- thẻ b in đậm 
    thẻ i in nghiêng
    thẻ u gạch chân -->
    <b>thẻ b</b>
    <i>thẻ i</i>
    <u>thẻ u</u>
    <div>
      <font face="verdana">Môn phát triển ứng dụng web</font>
      <font color="red">nhóm 03</font>
      <font size="8">Tiết 1 2</font>
    </div>
  </body>
</html>
