<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài 4</title>
  </head>
  <body>
    <h1>form tạo thông tin</h1>
    <form action="">
      <div>
        <p><b>Họ và tên:</b></p>
        <input type="text" name="HoVaTen" />
      </div>
      <!-- trong input nếu ko để type thì mặc định là text, nếu để type="text" thì
      cũng là text -->
      <div>
        <p><b>Giới thiệu:</b></p>
        <textarea name="gioithieu" id=""></textarea>
      </div>
      <!-- textarea là 1 thẻ dùng để nhập nhiều dòng, còn input thì chỉ nhập 1 dòng -->
      <div>
        <p><b>Email</b></p>
        <input type="email" name="Email" />
      </div>
      <div>
        <p><b>SĐT</b></p>
        <input
          type="tel"
          name="SDT"
          placeholder="Dạng số"
          pattern="([0]{1})([9,3,6,8]{1})([0-9]{8})"
        />
      </div>
      <div>
        <p><b>Giới tính</b></p>
        <input type="radio" name="gioitinh" value="Nam" /> Nam
        <input type="radio" name="gioitinh" value="Nữ" /> Nữ
      </div>
      <div>
        <p><b>Sở thích</b></p>
        Game: <input type="checkbox" name="sothich" value="Game" /><br />
        Bóng đá:<input type="checkbox" name="sothich" value="Bóng đá" /><br />
        Du lịch:<input type="checkbox" name="sothich" value="Du lịch" /> <br />
        Music:<input type="checkbox" name="sothich" value="Music" />
      </div>
      <div>
        <p><b>Trình duyệt hay sử dụng</b></p>
        <input list="browsers" name="browser" />
        <datalist id="browsers">
          <option value="Chrome">Chrome</option>
          <option value="CocCoc">CocCoc</option>
          <option value="FireFox">FireFox</option>
          <option value="Edge">Edge</option>
        </datalist>
        <select name="browser">
          <option value="Chrome">Chrome</option>
          <option value="CocCoc">CocCoc</option>
          <option value="FireFox">FireFox</option>
          <option value="Edge">Edge</option>
        </select>
      </div>
      <div>0<input type="range" id="a" value="50" min="0" max="100" />100</div>
      <div>
        <input type="submit" /> <button>Click</button>
        <input type="reset" />
      </div>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/ZPhtT4p9_yk?si=jhN1DGQ8mZsBCxyd"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <marquee>
        <img src="../anh/doibongtoiyeu.jfif" width="200px" height="300px" />
      </marquee>
      <video controls width="250">
        <source src="../anh/bão 2024 (1).mp4" type="video/mp4" />
      </video>
    </form>
    ví dụ thẻ h1 &lt;h1&gt; là thẻ tiêu đề lớn nhất
  </body>
</html>
